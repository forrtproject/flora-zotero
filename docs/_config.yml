title: Replication Checker for Zotero
description: >-
  A free Zotero plugin that shows which papers in your library have been
  replicated or reproduced, using FORRT's Library of Reproduction and
  Replication Attempts (FLoRA).
baseurl: /flora-zotero

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Every generated page gets the Atlas-styled shell. The workflow that copies
# the source markdown in also prepends front matter, so pages are rendered
# rather than served as raw .md.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Sources that live in docs/ for humans, not for the site.
exclude:
  - Website.md
  - README_dev.md
  - Release.md
  - LOCALIZATION.md

# Site pages, used for the footer row and the "Keep reading" links at the foot
# of every document page. The top bar shows only the entries marked `topbar`:
# Contributing and the Release Guide are for contributors and maintainers, not
# for researchers installing the plugin. Outbound links (Replication Atlas,
# Report Issue) and the Download CTA live in the layout, since they are not
# site pages. URLs carry a trailing slash: each page is built as
# <name>/index.html.
navigation:
  - title: Home
    url: /
    topbar: true
  - title: Documentation
    url: /documentation/
    topbar: true
  - title: Contributing
    url: /contributing/
  - title: Release Guide
    url: /release-guide/

# GitHub metadata
github:
  repository_url: https://github.com/forrtproject/flora-zotero

# FORRT branding and sibling properties
forrt:
  main_site: https://forrt.org/
  project_name: FORRT
  tagline: Framework for Open and Reproducible Research Training
  hub: https://forrt.org/replication-hub/
  flora: https://forrt.org/replication-hub/flora/
  atlas: https://forrt.org/flora-replication-atlas/
  explorer: https://forrt.org/flora-explorer/
  contributors: https://forrt.org/contributors/?project=flora-zotero-plugin&&collapse-filter
  # Form for reporting a missing or wrong FLoRA record (the same one the plugin
  # links from its notes).
  data_issues: https://forms.gle/Tn2eqasUU1WE86Dq8

# Plugin info. The manifest sets no upper Zotero version (v0.1.14 supports
# Zotero 7 to 10), so the site states only the minimum.
plugin:
  zotero: "7 or later"
