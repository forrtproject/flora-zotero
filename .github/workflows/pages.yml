name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      # The site shell lives in the repo, not in this workflow:
      # docs/_config.yml, docs/_layouts/default.html, docs/assets/css/site.css
      # and docs/_data/docs_nav.yml are all committed and reviewable. This step
      # only assembles the pages that are derived from files elsewhere in the
      # repo, using the same module `scripts/preview-pages.py` runs locally.
      - name: Assemble site content
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 scripts/build_docs.py

      - name: Copy favicon and share images
        run: |
          set -euo pipefail
          mkdir -p docs/assets
          if [ -f "addon/content/icons/favicon.png" ]; then
            cp addon/content/icons/favicon.png docs/assets/favicon.png
          fi
          if [ -f "docs/logo/replication-checker-logo.png" ]; then
            cp docs/logo/replication-checker-logo.png docs/assets/replication-checker-logo.png
          fi
          # Icon-only square share image: link previews (Slack, LinkedIn, ...) crop the
          # wide text logo badly, so they get the icon on a solid white background instead
          if [ -f "docs/logo/replication-checker-social.png" ]; then
            cp docs/logo/replication-checker-social.png docs/assets/replication-checker-social.png
          fi

      - name: Fetch update.json from the latest release
        run: |
          # The release workflow creates update.json with the correct hash for the release XPI
          echo "Fetching update.json from latest release..."
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/forrtproject/flora-zotero/releases/latest)
          UPDATE_JSON_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[]? | select(.name == "update.json") | .browser_download_url' 2>/dev/null || echo "")

          if [ -n "$UPDATE_JSON_URL" ] && [ "$UPDATE_JSON_URL" != "null" ]; then
            echo "Downloading update.json from: $UPDATE_JSON_URL"
            curl -L -o docs/update.json "$UPDATE_JSON_URL"
            echo "✅ Downloaded update.json from latest release"
            echo "Update.json contents:"
            cat docs/update.json
          elif [ -f ".scaffold/build/update.json" ]; then
            echo "⚠️ No update.json in latest release, falling back to scaffold build"
            cp .scaffold/build/update.json docs/update.json
            echo "Update.json contents:"
            cat docs/update.json
          else
            echo "⚠️ Warning: update.json not found"
          fi

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
